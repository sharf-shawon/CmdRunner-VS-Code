name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type-check, Test, Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      - name: Run tests with coverage
        run: xvfb-run -a npm run test:coverage
      - name: Check coverage thresholds
        run: npx c8 check-coverage --lines 80 --functions 80 --branches 80 --statements 80
      - name: VSIX dry-run
        run: npx @vscode/vsce package --no-dependencies 2>/dev/null || true
