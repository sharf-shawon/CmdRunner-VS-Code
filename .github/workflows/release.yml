name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create GitHub Release

jobs:
  release:
    name: Publish to VS Code Marketplace & Open VSX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run compile
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies --out cmdrunner.vsix
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath cmdrunner.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx ovsx publish cmdrunner.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cmdrunner.vsix
          generate_release_notes: true
