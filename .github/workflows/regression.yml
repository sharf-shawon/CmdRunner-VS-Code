name: Regression
on:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  regression:
    name: Nightly tests – VS Code ${{ matrix.vscode-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        vscode-version: [stable, '1.95', '1.90']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run tests (${{ matrix.vscode-version }})
        uses: coactions/setup-xvfb@v1
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
        with:
          run: npm test

  file-issue-on-failure:
    name: File issue on failure
    runs-on: ubuntu-latest
    needs: regression
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Regression] Nightly test failure – ${today}`,
              body: [
                '## Nightly Regression Failure',
                '',
                `**Date:** ${today}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'One or more VS Code version matrix legs failed. Please investigate.',
              ].join('\n'),
              labels: ['bug', 'regression', 'automated'],
            });
