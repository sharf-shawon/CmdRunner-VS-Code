name: Dependency Review
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Requires the GitHub Dependency Graph to be enabled in repository settings
    # (Settings → Security & analysis → Dependency graph). Until enabled, this
    # job is allowed to fail so it does not block pull requests.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Review dependencies for known CVEs
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
